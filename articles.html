<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Articles - GY Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="icon" href="img/blogo.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Search box styles */
        .search-container {
            max-width: 600px;
            margin: -2rem auto 3rem;
            position: relative;
        }
        .search-container input {
            width: 100%;
            padding: 0.9rem 1.5rem;
            border: 2px solid #e2e8f0;
            border-radius: 50px;
            font-size: 1rem;
            font-family: var(--font-body);
            background: white;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            outline: none;
        }
        .search-container input:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px rgba(0, 51, 102, 0.1);
        }
        .search-container input::placeholder {
            color: #a0aec0;
        }
        .search-container .clear-search {
            position: absolute;
            right: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 1.4rem;
            color: #a0aec0;
            cursor: pointer;
            display: none;
            padding: 0 0.2rem;
        }
        .search-container .clear-search.visible {
            display: block;
        }
        .search-container .clear-search:hover {
            color: var(--primary-blue);
        }
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            color: #718096;
            font-size: 1.1rem;
        }
        .search-stats {
            text-align: center;
            font-size: 0.95rem;
            color: #4a5568;
            margin-top: -1.5rem;
            margin-bottom: 1.5rem;
        }
        .search-stats strong {
            color: var(--primary-blue);
        }

        @media (max-width: 768px) {
            .search-container {
                margin: -1rem auto 2rem;
                padding: 0 1rem;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo">
                    <a href="index.html">
                        <img src="img/blogo.png" alt="Personal Logo">
                    </a>
                </div>
                <div class="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="articles.html">Articles</a></li>
                    <li><a href="awards.html">Awards</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="section">
            <div class="container">
                <h2 class="section-title" id="articles-title">My Articles</h2>
                
                <!-- Search Box -->
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Search articles by title, author, or keyword…" aria-label="Search articles">
                    <button class="clear-search" id="clearSearch" aria-label="Clear search">✕</button>
                </div>
                <div id="searchStats" class="search-stats" style="display:none;"></div>

                <div class="article-grid" id="article-list">
                    <!-- Articles will be loaded here via JS -->
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; <span id="year">2026</span> <span id="footer-rights">GY LIM. All Rights Reserved.</span></p>
        </div>
    </footer>

    <script src="https://formspree.io/js/formbutton-v1.min.js" defer></script>
    <script>
        /* Formspree configuration (unchanged) */
        window.formbutton = window.formbutton || function () { (formbutton.q = formbutton.q || []).push(arguments); };
        formbutton("create", {
            action: "https://formspree.io/mgozoglb",
            title: "How can we help?",
            fields: [
                { type: "text", label: "Name:", name: "name", required: true, placeholder: "Your Name" },
                { type: "email", label: "Email:", name: "email", required: true, placeholder: "your@email.com" },
                { type: "textarea", label: "Message:", name: "message", placeholder: "What's on your mind?" },
                { type: "submit" }
            ],
            styles: `/* Your existing styles here (same as before) */`,
            initiallyVisible: false
        });
    </script>
    <script src="script.js"></script>
</body>

</html>
