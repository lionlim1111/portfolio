<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awards - GY Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="icon" href="img/blogo.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* 确保空状态显示正常 */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            color: #4a5568;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03);
            border: 2px dashed rgba(0, 51, 102, 0.15);
            font-size: 1.1rem;
            font-weight: 500;
        }
        .empty-state .icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 0.75rem;
        }
        .empty-state .sub {
            font-size: 0.9rem;
            color: #a0aec0;
            font-weight: 400;
            margin-top: 0.5rem;
        }
        .error-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            background: #fff5f5;
            border-radius: 12px;
            border: 1px solid #feb2b2;
        }
        .error-message h2 {
            color: #c53030;
            font-family: 'Outfit', sans-serif;
            margin-bottom: 0.5rem;
        }
        .error-message p {
            color: #4a5568;
        }
    </style>
</head>

<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo">
                    <a href="index.html">
                        <img src="img/blogo.png" alt="Personal Logo">
                    </a>
                </div>
                <div class="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="articles.html">Articles</a></li>
                    <li><a href="awards.html">Awards</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="section">
            <div class="container">
                <h2 class="section-title" id="awards-title">Honors & Awards</h2>
                <div class="project-grid" id="awards-grid">
                    <!-- 默认显示加载状态，由 JavaScript 替换 -->
                    <div class="loading-container" style="grid-column: 1 / -1;">
                        <div class="loading-spinner"></div>
                        <p>Loading awards…</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; <span id="year">2026</span> <span id="footer-rights">GY LIM. All Rights Reserved.</span></p>
        </div>
    </footer>

    <script src="https://formspree.io/js/formbutton-v1.min.js" defer></script>
    <script>
        window.formbutton = window.formbutton || function () { (formbutton.q = formbutton.q || []).push(arguments); };
        formbutton("create", {
            action: "https://formspree.io/mgozoglb",
            title: "How can we help?",
            fields: [
                { type: "text", label: "Name:", name: "name", required: true, placeholder: "Your Name" },
                { type: "email", label: "Email:", name: "email", required: true, placeholder: "your@email.com" },
                { type: "textarea", label: "Message:", name: "message", placeholder: "What's on your mind?" },
                { type: "submit" }
            ],
            styles: `/* 保持您原有的 Formspree 样式不变 */`,
            initiallyVisible: false
        });
    </script>
    <script src="script.js"></script>
</body>

</html>
